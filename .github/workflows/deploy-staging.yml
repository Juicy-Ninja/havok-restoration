name: Deploy staging to GitHub Pages

# Every push to main rebuilds the site in staging mode and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://juicyninja.github.io/havok-restoration/
# Staging is noindex + robots disallow, so it never competes with the production domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:staging
        env:
          BASE_PATH: /havok-restoration
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy staging'
